name: CI

# Every PR gets the full check battery; main additionally deploys — and only
# after every check passes. That ordering is the reason deploy lives HERE as a
# dependent job rather than using Cloudflare's git-connected Workers Builds:
# Workers Builds deploys on push in parallel with CI, so a commit that fails an
# invariant would ship anyway. `needs: build` makes green checks a precondition.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history, not the default shallow clone. The lastmod check below
      # derives each page's date from `git log`, and at depth 1 git knows one
      # commit — so every route resolves to HEAD and the map becomes "everything
      # changed at the last deploy", which is the exact signal the git
      # derivation exists to avoid.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # `npm ci`, not `npm install` — the lockfile is the contract.
      - run: npm ci

      # Source-level a11y lint (jsx-a11y-strict over .astro templates) — the
      # defect class the built-HTML checks below can't see: malformed ARIA,
      # roles on wrong elements, non-interactive tabindex. Runs before the
      # build because it needs no artifact.
      - name: Lint templates (a11y-strict)
        run: npx eslint .

      # A route for every collection, checked BEFORE the build: a collection
      # with entries and no route renders nowhere, indefinitely, without any
      # error — the original site shipped a glossary that way for weeks.
      - name: Check every content collection has a route
        run: |
          fail=0
          for dir in src/content/*/; do
            name=$(basename "$dir")
            if [ ! -f "src/pages/$name/[...slug].astro" ]; then
              echo "FAIL: collection '$name' has entries but no src/pages/$name/[...slug].astro route"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "ok: every collection has a route"
          exit $fail

      # Frontmatter ogImage strings and markdown image refs are not imports —
      # Astro never verifies them, so a typo'd path ships a 404 OG card
      # silently. Runs before the build because it reads src, not dist.
      - name: Check content image references
        run: node scripts/check-content-images.mjs

      # `npm run build` is `astro check && check:worker && sheets && llms &&
      # astro build && markdown-twins && search:index`, so this covers types,
      # the zod content schemas, the actual render and the search index in one
      # step. A post whose frontmatter is missing `sources` fails here rather
      # than at deploy.
      - run: npm run build

      # The sitemap's <lastmod> comes from a committed map (see
      # scripts/lastmod.mjs for why). A committed file can go stale, so
      # regenerate it here — where full history exists — and compare. Runs
      # BEFORE the invariants so a stale map is reported as itself rather than
      # as some downstream oddity.
      - name: Check src/data/lastmod.json is current
        run: |
          cp src/data/lastmod.json "$RUNNER_TEMP/lastmod.committed.json"
          npm run lastmod
          node scripts/check-lastmod.mjs "$RUNNER_TEMP/lastmod.committed.json"

      # Cheap guards for the rules that keep getting broken by hand.
      #
      # Deliberately no `set -e`. Two reasons, both learned the hard way:
      #   1. grep exits 1 when it finds nothing, so `n=$(grep -o x f | wc -l)`
      #      under `set -e -o pipefail` kills the script at the assignment — on
      #      exactly the page the check exists to catch, with no message.
      #   2. Collecting every failure beats stopping at the first.
      # Every count is guarded with `|| n=0` so a no-match is data, not a crash.
      - name: Check site invariants
        run: |
          set -uo pipefail
          fail=0

          echo "→ exactly one <h1> per page"
          bad=0
          while IFS= read -r f; do
            n=$(grep -o '<h1' "$f" | wc -l) || n=0
            if [ "$n" -ne 1 ]; then
              echo "   FAIL: $f has $n <h1> (page templates render the frontmatter"
              echo "         title as the h1 — start MDX bodies at ##)"
              bad=1; fail=1
            fi
          done < <(find dist -name '*.html')
          [ "$bad" -eq 0 ] && echo "   ok"

          echo "→ every table wrapped in .table-scroll"
          bad=0
          while IFS= read -r f; do
            t=$(grep -o '<table' "$f" | wc -l) || t=0
            w=$(grep -o 'table-scroll' "$f" | wc -l) || w=0
            if [ "$t" -gt "$w" ]; then
              echo "   FAIL: $f has $t table(s) but $w wrapper(s) — a bare table"
              echo "         scrolls the whole page sideways on a phone"
              bad=1; fail=1
            fi
          done < <(grep -rl '<table' dist --include='*.html' || true)
          [ "$bad" -eq 0 ] && echo "   ok"

          echo "→ <title> at most 60 characters"
          # BaseLayout clamps every title via clampTitle(), so a failure here
          # means the clamp was bypassed or has a bug — not an author's string.
          if ! node -e '
            const fs = require("fs");
            let bad = 0;
            for (const f of process.argv.slice(1)) {
              const html = fs.readFileSync(f, "utf8");
              const m = html.match(/<title>([^<]*)<\/title>/);
              if (!m) continue;
              if (m[1].length > 60) {
                console.log(`   FAIL: ${f} — ${m[1].length} chars: "${m[1]}"`);
                bad = 1;
              }
            }
            process.exit(bad);
          ' $(find dist -name '*.html'); then
            fail=1
          else
            echo "   ok"
          fi

          echo "→ no broken internal links"
          # Every root-relative href must resolve to a file the deploy will
          # actually serve. This is the in-repo half of the lesson "a redirect
          # written in a doc is not a redirect" — anything that only exists as
          # dashboard config or worker code is whitelisted explicitly, so the
          # whitelist is also the inventory of off-repo routes.
          if ! node -e '
            const fs = require("fs"), path = require("path");
            const WORKER_ROUTES = ["/api/", "/hi"];  // exist in worker/index.ts, not dist/
            let bad = 0;
            const files = process.argv.slice(1);
            for (const f of files) {
              const html = fs.readFileSync(f, "utf8");
              for (const m of html.matchAll(/href="(\/[^"#?]*)/g)) {
                const p = decodeURIComponent(m[1]);
                if (WORKER_ROUTES.some((w) => p.startsWith(w))) continue;
                const clean = p.replace(/\/$/, "") || "/index";
                const candidates = [
                  path.join("dist", clean),
                  path.join("dist", clean + ".html"),
                  path.join("dist", clean, "index.html"),
                ];
                if (!candidates.some((c) => fs.existsSync(c))) {
                  console.log(`   FAIL: ${f} links to ${p} which nothing serves`);
                  bad = 1;
                }
              }
            }
            process.exit(bad);
          ' $(find dist -name '*.html'); then
            fail=1
          else
            echo "   ok"
          fi

          echo "→ every CTA carries an analytics event"
          # The rule: every conversion surface is measured, whichever analytics
          # vendor is active. CTAs (.btn), tel: and mailto: links all leave the
          # page — no pageview fires for them, so an unmarked one is invisible
          # to analytics forever. data-umami-event is the vendor-neutral marker
          # (Umami binds it natively; the consent banner forwards it to GA4).
          if ! node -e '
            const fs = require("fs");
            let bad = 0;
            for (const f of process.argv.slice(1)) {
              const html = fs.readFileSync(f, "utf8");
              for (const m of html.matchAll(/<a\s[^>]*>/g)) {
                const tag = m[0];
                const isCta = /class="[^"]*\bbtn\b[^"]*"/.test(tag);
                const leaves = /href="(tel:|mailto:)/.test(tag);
                if ((isCta || leaves) && !/data-umami-event=/.test(tag)) {
                  console.log(`   FAIL: ${f} unmeasured CTA: ${tag.slice(0, 120)}`);
                  bad = 1;
                }
              }
            }
            process.exit(bad);
          ' $(find dist -name '*.html'); then
            fail=1
          else
            echo "   ok"
          fi

          echo "→ every <img> has an alt attribute"
          # Empty alt is fine (a decision: decorative); a MISSING alt is the
          # forgotten case screen readers read as the filename.
          if ! node -e '
            const fs = require("fs");
            let bad = 0;
            for (const f of process.argv.slice(1)) {
              const html = fs.readFileSync(f, "utf8");
              for (const m of html.matchAll(/<img\s[^>]*>/g)) {
                if (!/\salt\s*=/.test(m[0])) {
                  console.log(`   FAIL: ${f} img without alt: ${m[0].slice(0, 100)}`);
                  bad = 1;
                }
              }
            }
            process.exit(bad);
          ' $(find dist -name '*.html'); then
            fail=1
          else
            echo "   ok"
          fi

          echo "→ target=_blank links announce the new tab and carry noopener"
          if ! node -e '
            const fs = require("fs");
            let bad = 0;
            for (const f of process.argv.slice(1)) {
              const html = fs.readFileSync(f, "utf8");
              for (const m of html.matchAll(/<a\s[^>]*target="_blank"[^>]*>(.*?)<\/a>/gs)) {
                const relOk = /rel="[^"]*noopener[^"]*"/.test(m[0]);
                const announced = /new tab/i.test(m[1]);
                if (!relOk || !announced) {
                  console.log(`   FAIL: ${f} _blank link needs rel=noopener + "new tab" in its accessible name: ${m[0].slice(0, 120)}`);
                  bad = 1;
                }
              }
            }
            process.exit(bad);
          ' $(find dist -name '*.html'); then
            fail=1
          else
            echo "   ok"
          fi

          echo "→ no noindex page in the sitemap"
          # Mechanizes the iron rule (noindex ⇔ out of sitemap) that was
          # previously enforced only by convention.
          if ! node -e '
            const fs = require("fs"), path = require("path");
            let bad = 0;
            const xml = fs.readFileSync("dist/sitemap-0.xml", "utf8");
            for (const m of xml.matchAll(/<loc>([^<]+)<\/loc>/g)) {
              const p = new URL(m[1]).pathname.replace(/\/$/, "") || "/";
              const clean = p === "/" ? "/index" : p;
              const file = [path.join("dist", clean + ".html"), path.join("dist", clean, "index.html")]
                .find((c) => fs.existsSync(c));
              if (!file) continue; // coverage is the lastmod check\x27s job
              if (/name="robots" content="noindex/.test(fs.readFileSync(file, "utf8"))) {
                console.log(`   FAIL: ${m[1]} is in the sitemap but renders noindex`);
                bad = 1;
              }
            }
            process.exit(bad);
          '; then
            fail=1
          else
            echo "   ok"
          fi

          echo "→ pagefind index exists and covers every data-pagefind-body page"
          if ! node -e '
            const fs = require("fs");
            const entry = JSON.parse(fs.readFileSync("dist/pagefind/pagefind-entry.json", "utf8"));
            const indexed = Object.values(entry.languages).reduce((n, l) => n + l.page_count, 0);
            const expected = process.argv.slice(1).filter((f) =>
              fs.readFileSync(f, "utf8").includes("data-pagefind-body")).length;
            if (indexed !== expected) {
              console.log(`   FAIL: pagefind indexed ${indexed} pages, but ${expected} pages carry data-pagefind-body`);
              process.exit(1);
            }
          ' $(find dist -name '*.html'); then
            fail=1
          else
            echo "   ok"
          fi

          echo "→ no orphan content pages (related links present)"
          # Only enforced once a collection has >= 2 published entries — a
          # site with one post cannot link it to a sibling.
          if ! node -e '
            const fs = require("fs");
            let bad = 0;
            for (const dir of ["blog", "glossary"]) {
              const pages = fs.readdirSync(`dist/${dir}`).filter((f) => f.endsWith(".html"));
              if (pages.length < 2) continue;
              for (const p of pages) {
                const html = fs.readFileSync(`dist/${dir}/${p}`, "utf8");
                const rel = html.match(/<section class="related"[\s\S]*?<\/section>/);
                if (!rel || !/href="\/(blog|glossary)\//.test(rel[0])) {
                  console.log(`   FAIL: ${dir}/${p} has no related-content links — an orphan page`);
                  bad = 1;
                }
              }
            }
            process.exit(bad);
          '; then
            fail=1
          else
            echo "   ok"
          fi

          echo "→ visible breadcrumbs mirror BreadcrumbList JSON-LD"
          if ! node -e '
            const fs = require("fs");
            let bad = 0;
            for (const f of process.argv.slice(1)) {
              const html = fs.readFileSync(f, "utf8");
              if (!html.includes("\"BreadcrumbList\"")) continue;
              const ld = html.match(/<script type="application\/ld\+json">([\s\S]*?)<\/script>/);
              const graph = JSON.parse(ld[1].replaceAll("\\u003C", "<"));
              const list = (graph["@graph"] ?? [graph]).find((n) => n["@type"] === "BreadcrumbList");
              const nav = html.match(/<nav class="crumbs"[^>]*>[\s\S]*?<\/nav>/);
              if (!nav) {
                console.log(`   FAIL: ${f} emits BreadcrumbList but renders no visible trail`);
                bad = 1; continue;
              }
              const lis = (nav[0].match(/<li[\s>]/g) ?? []).length;
              if (lis !== list.itemListElement.length) {
                console.log(`   FAIL: ${f} BreadcrumbList has ${list.itemListElement.length} items, visible trail has ${lis}`);
                bad = 1; continue;
              }
              // Names appear in order. Compare against the DECODED nav text —
              // Astro entity-escapes text nodes (e.g. apostrophe → &#39;).
              const decoded = nav[0]
                .replace(/&#(\d+);/g, (_, n) => String.fromCharCode(n))
                .replace(/&quot;/g, "\"").replace(/&lt;/g, "<")
                .replace(/&gt;/g, ">").replace(/&amp;/g, "&");
              let pos = 0;
              for (const item of list.itemListElement) {
                const at = decoded.indexOf(item.name, pos);
                if (at === -1) {
                  console.log(`   FAIL: ${f} breadcrumb "${item.name}" missing or out of order in the visible trail`);
                  bad = 1; break;
                }
                pos = at;
              }
            }
            process.exit(bad);
          ' $(find dist -name '*.html'); then
            fail=1
          else
            echo "   ok"
          fi

          echo "→ every .table-scroll wrapper is a labelled keyboard-scrollable region"
          if ! node -e '
            const fs = require("fs");
            let bad = 0;
            for (const f of process.argv.slice(1)) {
              const html = fs.readFileSync(f, "utf8");
              for (const m of html.matchAll(/<div[^>]*class="[^"]*table-scroll[^"]*"[^>]*>/g)) {
                const tag = m[0];
                if (!/tabindex="0"/.test(tag) || !/role="region"/.test(tag) || !/aria-label="[^"]+"/.test(tag)) {
                  console.log(`   FAIL: ${f} table-scroll without tabindex/role/aria-label: ${tag.slice(0, 120)}`);
                  bad = 1;
                }
              }
            }
            process.exit(bad);
          ' $(find dist -name '*.html'); then
            fail=1
          else
            echo "   ok"
          fi

          if [ "$fail" -ne 0 ]; then
            echo "Invariant check failed."
            exit 1
          fi
          echo "All invariants hold."

      # WCAG AA contrast over every built page. An eye is not the instrument
      # for this: the ancestor site's hand-picked brand colour measured 2.8:1
      # and failed on 66 element pairs including its own primary CTA.
      #
      # Playwright is installed here rather than added to package.json on
      # purpose: it is a CI/publish-time tool, and keeping it out of the
      # manifest keeps a 300MB browser out of every `npm ci`.
      - name: Check colour contrast
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          npm run check:contrast

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # build:ci skips `astro check` — types already gated the build job; the
      # deploy job only needs the artifact.
      - run: npm run build:ci

      # Needs one repo secret: CLOUDFLARE_API_TOKEN, scoped to "Edit Workers"
      # on this account only — never a Global API Key. Create at
      # dash.cloudflare.com → My Profile → API Tokens.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
