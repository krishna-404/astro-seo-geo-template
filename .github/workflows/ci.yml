name: CI

# Every PR gets the full check battery; main additionally deploys — and only
# after every check passes. That ordering is the reason deploy lives HERE as a
# dependent job rather than using Cloudflare's git-connected Workers Builds:
# Workers Builds deploys on push in parallel with CI, so a commit that fails an
# invariant would ship anyway. `needs: build` makes green checks a precondition.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history, not the default shallow clone. The lastmod check below
      # derives each page's date from `git log`, and at depth 1 git knows one
      # commit — so every route resolves to HEAD and the map becomes "everything
      # changed at the last deploy", which is the exact signal the git
      # derivation exists to avoid.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # `npm ci`, not `npm install` — the lockfile is the contract.
      - run: npm ci

      # Source-level a11y lint (jsx-a11y-strict over .astro templates) — the
      # defect class the built-HTML checks below can't see: malformed ARIA,
      # roles on wrong elements, non-interactive tabindex. Runs before the
      # build because it needs no artifact.
      - name: Lint templates (a11y-strict)
        run: npx eslint .

      # A route for every collection, checked BEFORE the build: a collection
      # with entries and no route renders nowhere, indefinitely, without any
      # error — the original site shipped a glossary that way for weeks.
      # Same script as the pre-commit hook and verify.mjs, so the rungs
      # cannot drift; all-draft collections are a deliberate skip.
      - name: Check every content collection has a route
        run: node scripts/check-collection-routes.mjs

      # Frontmatter ogImage strings and markdown image refs are not imports —
      # Astro never verifies them, so a typo'd path ships a 404 OG card
      # silently. Runs before the build because it reads src, not dist.
      - name: Check content image references
        run: node scripts/check-content-images.mjs

      # The "must change together" pairs (format↔html_handling, twin routes
      # in three places, static↔worker security headers) and the repo-wide
      # source bans (web storage, colour literals). Source-level and fast —
      # the same checks the pre-commit hook runs, re-run here because hooks
      # are advisory (--no-verify exists; CI does not).
      - name: Check config parity and source rules
        run: |
          node scripts/check-parity.mjs
          node scripts/check-source-rules.mjs

      # The mechanical half of the anti-AI defence: banned vocabulary and
      # shapes, em-dash density, stacked bold lead-ins, Title Case headings —
      # every rule in src/data/voice.json a regex can see. The judgement half
      # is the ship checklist in marketing/VOICE-GUIDE.md.
      - name: Mechanical voice check (anti-AI rules)
        run: node scripts/check-voice.mjs

      # Interlinking as a graph: no orphan content pages, no dead internal
      # links, no junk anchor text. Per-page outbound minimums live in
      # check-source-rules; this sees the shape no single page can.
      - name: Site-wide link graph
        run: node scripts/check-link-graph.mjs

      # The generated inventory answers "does this already exist?" — a stale
      # one answers wrong, silently. Regenerate with `npm run inventory`.
      - name: Content inventory is current
        run: node scripts/content-inventory.mjs --check

      # `npm run build` is `astro check && check:worker && sheets && llms &&
      # astro build && markdown-twins && search:index`, so this covers types,
      # the zod content schemas, the actual render and the search index in one
      # step. A post whose frontmatter is missing `sources` fails here rather
      # than at deploy.
      - run: npm run build

      # The CSP is generated from the built site's inline scripts
      # (scripts/generate-csp.mjs, runs inside `npm run build`) and the worker
      # imports the COMMITTED copy. A build that changes an inline script
      # changes the hashes — this diff fails until the new value is committed,
      # so the worker and the asset layer can never serve two different
      # policies. Same pattern as the lastmod map below.
      - name: Check committed worker CSP is current
        run: git diff --exit-code worker/csp.generated.json

      # The sitemap's <lastmod> comes from a committed map (see
      # scripts/lastmod.mjs for why). A committed file can go stale, so
      # regenerate it here — where full history exists — and compare. Runs
      # BEFORE the invariants so a stale map is reported as itself rather than
      # as some downstream oddity.
      - name: Check src/data/lastmod.json is current
        run: |
          cp src/data/lastmod.json "$RUNNER_TEMP/lastmod.committed.json"
          npm run lastmod
          node scripts/check-lastmod.mjs "$RUNNER_TEMP/lastmod.committed.json"

      # Every built-output invariant lives in ONE script shared with the
      # local pre-push battery (npm run verify) — scripts/check-invariants.mjs
      # — so CI and local runs can never drift. It collects every failure
      # per run rather than stopping at the first.
      - name: Check site invariants
        run: node scripts/check-invariants.mjs

      # The worker is the only code in the repo with logic, and tsc proves
      # nothing about behavior. Runs it for real (wrangler dev against the
      # built dist) and asserts every behavior it exists to provide: form 303,
      # twin negotiation incl. HEAD + Vary, /hi rewrite + noindex, data-proxy
      # 404s, security headers + committed CSP on worker responses.
      - name: Worker behavioral smoke test
        run: npm run smoke:worker

      # Structural HTML validity over the built output: duplicate ids, invalid
      # nesting, malformed attributes — the classes browsers silently repair
      # and crawlers silently don't. Config in .htmlvalidate.json; the one
      # exclusion (role="region" divs) is the deliberate .table-scroll pattern,
      # whose semantics have their own invariant above.
      - name: Validate built HTML
        run: |
          npm install --no-save html-validate
          npx html-validate "dist/**/*.html"

      # Playwright is installed here rather than added to package.json on
      # purpose: it is a CI/publish-time tool, and keeping it out of the
      # manifest keeps a 300MB browser out of every `npm ci`.
      - name: Check colour contrast
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          npm run check:contrast

      # axe-core over every built page — the engine class the structural
      # invariants and the source lint can't see: broken ARIA references,
      # accessible-name computation, landmark structure. Fails on
      # serious/critical; axe's colour-contrast rule is disabled in the script
      # because the sweep above measures it properly (composited backgrounds).
      #
      # ⚠ playwright is REINSTALLED here even though the contrast step just
      # installed it: `npm install --no-save X` reconciles against the
      # lockfile and PRUNES earlier --no-save packages, so installing
      # axe-core alone silently removes playwright (bit the first real CI
      # run). The browser binary survives — only the package is re-linked.
      - name: Accessibility scan (axe-core)
        run: |
          npm install --no-save playwright axe-core
          npm run check:a11y

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Soft-skip (green) while the deploy secret is unset: a template repo
      # has nothing to deploy, and a permanently red deploy job teaches
      # people to ignore red — same principle as smoke-live's origin gate.
      # A gate STEP because GitHub does not expose `secrets` to job-level
      # `if`; every later step conditions on its output.
      - name: Check deploy is configured
        id: gate
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN is not set — nothing to deploy; skipping (green)."
            echo "To arm deploys: add the repo secret (scoped: Edit Workers) — README § A new site."
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.configured == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        if: steps.gate.outputs.configured == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.gate.outputs.configured == 'true'

      # build:ci skips `astro check` — types already gated the build job; the
      # deploy job only needs the artifact.
      - run: npm run build:ci
        if: steps.gate.outputs.configured == 'true'

      # Needs one repo secret: CLOUDFLARE_API_TOKEN, scoped to "Edit Workers"
      # on this account only — never a Global API Key. Create at
      # dash.cloudflare.com → My Profile → API Tokens.
      - uses: cloudflare/wrangler-action@v3
        if: steps.gate.outputs.configured == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # The automated subset of PLAYBOOK §8, against the LIVE site: zone
      # redirects, HSTS single-emitter, CSP, /hi rewrite, twin negotiation,
      # machine surfaces. Only post-deploy code can see this layer — the
      # ancestor's www redirect served 404 for days with a green repo.
      # Soft-skips (green) while origin.mjs still says example.com.
      # Requests retry internally, so edge propagation doesn't cry wolf.
      - name: Smoke test the live site
        if: steps.gate.outputs.configured == 'true'
        run: node scripts/smoke-live.mjs
