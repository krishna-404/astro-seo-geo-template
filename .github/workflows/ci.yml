name: CI

# Nothing ran on pull requests before this, so `astro check` was enforced only
# on whoever remembered to run it locally. Two real bugs reached a PR that way:
# markdown tables that scrolled the page sideways on a phone, and solution pages
# rendering two <h1>s.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history, not the default shallow clone. The lastmod check below
      # derives each page's date from `git log`, and at depth 1 git knows one
      # commit — so every route resolves to HEAD and the map becomes "everything
      # changed at the last deploy", which is the exact signal the git
      # derivation exists to avoid. Verified: a --depth 1 clone produces 44
      # routes with 1 distinct date.
      # v7, not v4. GitHub forces v4 onto Node 24 anyway and warns on every run;
      # v5 was the release that made that official, v7 is current.
      #
      # Both majors carry a breaking change and neither applies here, checked
      # rather than assumed: checkout v7 blocks fork-PR checkout for
      # `pull_request_target` and `workflow_run`, and this workflow triggers on
      # `pull_request` and `push`. setup-node v5 began caching automatically
      # when package.json has a `packageManager` field — ours does not, and the
      # `cache: npm` below is explicit regardless.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # `npm ci`, not `npm install` — the lockfile is the contract, and a build
      # that silently resolves different versions than the Docker image is worse
      # than no build at all.
      - run: npm ci

      # `npm run build` is `astro check && astro build`, so this covers types,
      # the zod content schemas and the actual render in one step. A post whose
      # frontmatter is missing `sources` fails here rather than at deploy.
      - run: npm run build

      # Cheap guards for the rules that keep getting broken by hand.
      #
      # Deliberately no `set -e`. Two reasons, both learned the hard way:
      #   1. grep exits 1 when it finds nothing, so `n=$(grep -o x f | wc -l)`
      #      under `set -e -o pipefail` kills the script at the assignment — on
      #      exactly the page the check exists to catch. The build went red with
      #      no message at all: no filename, no reason.
      #   2. Collecting every failure beats stopping at the first. If three pages
      #      are broken you want all three in one run, not three round trips.
      # Every count is guarded with `|| n=0` so a no-match is data, not a crash.
      #
      # The sitemap's <lastmod> comes from a committed map, because the Docker
      # build has no .git (see scripts/lastmod.mjs). A committed file can go
      # stale, so regenerate it here — where full history exists — and compare.
      # Runs BEFORE the invariants so a stale map is reported as itself rather
      # than as some downstream oddity.
      #
      # The comparison is not a plain diff: see scripts/check-lastmod.mjs for
      # why a commit that edits a page can never contain a map that knows that
      # commit's own date, and why exactly that one case is tolerated.
      - name: Check src/data/lastmod.json is current
        run: |
          cp src/data/lastmod.json "$RUNNER_TEMP/lastmod.committed.json"
          npm run lastmod
          node scripts/check-lastmod.mjs "$RUNNER_TEMP/lastmod.committed.json"

      - name: Check site invariants
        run: |
          set -uo pipefail
          fail=0

          echo "→ /pricing must carry no visible internal link"
          if grep -rq 'href="/pricing"' dist --include='*.html'; then
            echo "   FAIL: linked from:"
            grep -rl 'href="/pricing"' dist --include='*.html' | sed 's/^/     /'
            echo "   /pricing is deliberately unlinked — see CLAUDE.md § Site structure."
            fail=1
          else
            echo "   ok"
          fi

          echo "→ exactly one <h1> per page"
          bad=0
          while IFS= read -r f; do
            n=$(grep -o '<h1' "$f" | wc -l) || n=0
            if [ "$n" -ne 1 ]; then
              echo "   FAIL: $f has $n <h1> (page templates render the frontmatter"
              echo "         title as the h1 — start MDX bodies at ##)"
              bad=1; fail=1
            fi
          done < <(find dist -name '*.html')
          [ "$bad" -eq 0 ] && echo "   ok"

          echo "→ every table wrapped in .table-scroll"
          bad=0
          while IFS= read -r f; do
            t=$(grep -o '<table' "$f" | wc -l) || t=0
            w=$(grep -o 'table-scroll' "$f" | wc -l) || w=0
            if [ "$t" -gt "$w" ]; then
              echo "   FAIL: $f has $t table(s) but $w wrapper(s) — a bare table"
              echo "         scrolls the whole page sideways on a phone"
              bad=1; fail=1
            fi
          done < <(grep -rl '<table' dist --include='*.html' || true)
          [ "$bad" -eq 0 ] && echo "   ok"

          echo "→ <title> at most 60 characters"
          # BaseLayout clamps every title via clampTitle() before it reaches
          # the page, so a failure here means either the clamp was bypassed
          # (a raw <title> written outside BaseLayout) or clampTitle() itself
          # has a bug — not a page author forgetting to shorten a string.
          if ! node -e '
            const fs = require("fs");
            let bad = 0;
            for (const f of process.argv.slice(1)) {
              const html = fs.readFileSync(f, "utf8");
              const m = html.match(/<title>([^<]*)<\/title>/);
              if (!m) continue;
              if (m[1].length > 60) {
                console.log(`   FAIL: ${f} — ${m[1].length} chars: "${m[1]}"`);
                bad = 1;
              }
            }
            process.exit(bad);
          ' $(find dist -name '*.html'); then
            fail=1
          else
            echo "   ok"
          fi

          if [ "$fail" -ne 0 ]; then
            echo "Invariant check failed."
            exit 1
          fi
          echo "All invariants hold."

      # WCAG AA contrast over every built page. This is the only thing stopping
      # the old 2.8:1 brand orange from coming back as a text colour — it looked
      # right to everyone who chose it, which is exactly why an eye is not the
      # instrument for this. See src/styles/global.css.
      #
      # Playwright is installed here rather than added to package.json on
      # purpose: it is a publish-time and CI tool, and the Docker image runs
      # `npm ci` against the same lockfile. Keeping it out of the manifest keeps
      # a 300MB browser out of the production build. Same rule as the OG cards.
      - name: Check colour contrast
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          npm run check:contrast
