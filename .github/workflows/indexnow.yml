name: IndexNow

# Tell the answer-engine indexes that pages changed, instead of waiting days to
# be crawled. One POST to the shared IndexNow endpoint reaches Bing, Yandex,
# Seznam and Naver; with BING_WEBMASTER_API_KEY set the script also submits the
# last two days' URLs to Bing's own URL Submission API. Google does not
# participate in IndexNow — it still finds pages through the sitemap, which is
# why this is a supplement, not a replacement.
#
# OPT-IN, NOT AUTOMATIC (20 Sep 2026, reaffirmed 27 Sep 2026). GitHub Actions
# are opt-in in this repo (CHECKLIST §2): dispatch this by hand, or — the normal
# path — let the deploy call `npm run indexnow` itself. Both `/ship` and the
# daily cadence run do that AFTER `wrangler deploy` returns, which is also why
# the script no longer has a wait-for-deploy loop: production is already the new
# production by the time it reads the sitemap.
on:
  workflow_dispatch:

# A newer run supersedes an older one: the sitemap it submits is a superset, so
# cancelling the in-flight one loses nothing and saves runner minutes.
concurrency:
  group: indexnow
  cancel-in-progress: true

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Built here purely to learn how many URLs this commit SHOULD produce.
      # Nothing from dist/ is submitted — the script reads the live sitemap, so
      # it can never ping a URL that 404s.
      - run: npm run build:ci

      # --min-urls is a sanity floor, not a race guard: if the live sitemap has
      # fewer URLs than this commit builds, something upstream is wrong and
      # submitting a short list would waste the ping.
      #
      # Known gap, accepted: a commit that REMOVES pages lowers this count, so a
      # stale sitemap satisfies it. Rare, and harmless — the list is still read
      # from production.
      - name: Count URLs in the built sitemap
        id: expected
        run: |
          set -uo pipefail
          n=$(grep -o '<loc>' dist/sitemap-0.xml | wc -l) || n=0
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "This commit builds $n URLs."

      # The IndexNow key reaches the script two ways and either is enough: a
      # committed public/<key>.txt (the zero-setup path), or the INDEXNOW_KEY
      # repo secret wired here. With neither, the script logs a loud skip and
      # exits green — a fresh template clone must not carry a permanently red
      # workflow. BING_WEBMASTER_API_KEY is optional: without it the Bing URL
      # Submission half is skipped and says so.
      - name: Submit to IndexNow (and Bing, where the key is set)
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
        run: node scripts/indexnow.mjs --min-urls "${{ steps.expected.outputs.count }}"
