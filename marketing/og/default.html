<!doctype html>
<meta charset="utf-8">
<title>Docket OG image</title>
<!--
  Source for public/og/default.png. Rendered at exactly 1200x630 — the size
  LinkedIn, WhatsApp, Slack and X all crop from.

  Rules that shaped it:
  - Nothing smaller than 24px. A social card is viewed at ~500px wide on a
    desktop feed and less on a phone, so body copy from the site is unreadable
    here and only wastes space.
  - Everything important stays inside a centre safe area. Clients crop the
    edges differently; a headline that runs to the margin loses words.
  - Type and colour come from the site's tokens so it cannot drift out of brand.

  Regenerate:  node marketing/og/render.mjs
-->
<style>
  :root {
    --orange:#c2410c; --ink:#101828; --ink-3:#576170;
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:1200px; height:630px; }
  body {
    font-family:var(--font);
    background:linear-gradient(180deg,#fff 0%,#f5f8fe 62%);
    display:flex; flex-direction:column; justify-content:space-between;
    overflow:hidden;
  }
  .top { padding:44px 72px 0; }
  .brand { display:flex; align-items:center; gap:14px; margin-bottom:26px; }
  .brand svg { display:block; }
  .brand span { font-size:34px; font-weight:800; letter-spacing:-.02em; color:var(--ink); }
  .eyebrow {
    font-family:var(--mono); font-size:22px; font-weight:600; letter-spacing:.16em;
    text-transform:uppercase; color:var(--orange); margin-bottom:18px;
  }
  h1 {
    font-size:64px; line-height:1.06; letter-spacing:-.035em; font-weight:800;
    color:var(--ink); max-width:1010px;
  }
  h1 b { color:var(--orange); font-weight:800; }
  .sub {
    margin-top:22px; font-size:26px; line-height:1.35; color:var(--ink-3);
  }
  .art { line-height:0; }
  .art svg { width:1200px; height:186px; display:block; }
</style>

    <span>Docket</span>
  </div>
  <p class="eyebrow">AI trade desk</p>
  <h1>Import&#8211;export trade? Save <b>~$200k a year</b> on chasing paperwork.</h1>
  <p class="sub">Contracts in, follow-through automatic. dodocket.com</p>
</div>
