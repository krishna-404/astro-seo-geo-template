<!doctype html>
<meta charset="utf-8">
<title>Default OG image</title>
<!--
  Source for public/og/default.png — the card every page without a per-page
  card falls back to. Rendered at exactly 1200x630, the size LinkedIn,
  WhatsApp, Slack and X all crop from.

  EDIT THE THREE STRINGS BELOW (site name, tagline, domain) and the --brand
  colour for your site, then regenerate. Same style as page.html, with the
  tagline where a page title would be.

  Rules that shaped it:
  - Nothing smaller than 24px. A social card is viewed at ~500px wide on a
    desktop feed and less on a phone, so body copy is unreadable here.
  - Everything important stays inside the 72px margin. Clients crop the edges
    differently; a headline that runs to the margin loses words.
  - Self-contained: system fonts, no external assets, one background colour.

  Regenerate:  node marketing/og/render.mjs
-->
<style>
  :root {
    --brand:#0f4c81; /* keep in step with the brand colour in site.ts / global.css */
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:1200px; height:630px; }
  body {
    font-family:var(--font);
    background:var(--brand);
    color:#fff;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:64px 72px; overflow:hidden;
  }
  .eyebrow {
    font-family:var(--mono); font-size:24px; font-weight:600; letter-spacing:.16em;
    text-transform:uppercase; color:rgba(255,255,255,.75); margin-bottom:18px;
  }
  h1 {
    font-size:64px; line-height:1.08; letter-spacing:-.025em; font-weight:800;
    max-width:1010px;
  }
  .site {
    font-size:30px; font-weight:800; letter-spacing:-.02em;
    color:rgba(255,255,255,.9);
  }
  .site span { font-weight:500; color:rgba(255,255,255,.65); }
</style>
<div>
  <p class="eyebrow">Example Co</p>
  <h1>A one-line description of what this company does</h1>
</div>
<div class="site">Example Co <span>· example.com</span></div>
