<!doctype html>
<meta charset="utf-8">
<title>Per-page OG card template</title>
<!--
  Template for the per-page social cards in public/og/. Rendered at exactly
  1200x630 — the size LinkedIn, WhatsApp, Slack and X crop from.
  `render-pages.mjs` substitutes __BRAND_BG__ / __SITE_NAME__ and fills the
  hooks below; open this file directly to see the layout with sample content
  (the raw tokens will show — that is expected).

  Self-contained on purpose: system fonts, no external assets, one background
  colour. The rules that shaped it, and they matter more here because the
  headline is a page title rather than one hand-tuned line:

  - Nothing smaller than 24px. A card is viewed at ~500px wide in a feed.
  - Everything important stays inside the 72px margin. Clients crop the edges
    differently, and a headline running to the margin loses words.
  - The headline steps down for long titles (set by the renderer) rather than
    wrapping to four lines.

  Regenerate:  node marketing/og/render-pages.mjs  (after a build)
-->
<style>
  :root {
    /* Substituted by render-pages.mjs — edit BRAND_BG there, not here. */
    --brand: __BRAND_BG__;
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:1200px; height:630px; }
  body {
    font-family:var(--font);
    background:var(--brand);
    color:#fff;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:64px 72px; overflow:hidden;
  }
  .eyebrow {
    font-family:var(--mono); font-size:24px; font-weight:600; letter-spacing:.16em;
    text-transform:uppercase; color:rgba(255,255,255,.75); margin-bottom:18px;
  }
  /* Set by the renderer — a long title steps down rather than wrapping to
     four lines and running off the card. */
  h1 {
    font-size:54px; line-height:1.12; letter-spacing:-.02em; font-weight:800;
    max-width:1040px;
  }
  .site {
    font-size:30px; font-weight:800; letter-spacing:-.02em;
    color:rgba(255,255,255,.9);
  }
</style>
<div>
  <p class="eyebrow" id="eyebrow">Blog</p>
  <h1 id="headline">A sample page title long enough to wrap onto a second line</h1>
</div>
<div class="site">__SITE_NAME__</div>
